# Place inside the existing HTTPS server block.
location ~ ^/ssh(?:/.*)?$ {
    rewrite ^/ssh(?:/(.*))?$ /$1 break;

    proxy_pass http://unix:/run/ssh-allow/ssh-allow.sock;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
