name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-binaries:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu]
        include:
          - target: x86_64-unknown-linux-gnu
            name: ssh-allow-linux-x86_64

          - target: x86_64-unknown-linux-musl
            name: ssh-allow-linux-x86_64-musl

          - target: aarch64-unknown-linux-gnu
            name: ssh-allow-linux-aarch64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: contains(matrix.target, 'aarch64') || contains(matrix.target, 'musl')
        run: cargo install cross

      - name: Build binary
        run: |
          if [ "${{ contains(matrix.target, 'aarch64') || contains(matrix.target, 'musl') }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare asset
        run: |
          mkdir -p staging
          asset_name="${{ matrix.name }}"
          cp target/${{ matrix.target }}/release/ssh-allow staging/
          cp README.md README_en.md staging/
          cp -r deploy staging/
          cd staging && tar czf ../${asset_name}.tar.gz *
          echo "asset_name=$asset_name" >> "$GITHUB_ENV"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.asset_name }}
          path: ${{ env.asset_name }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ssh-allow-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
